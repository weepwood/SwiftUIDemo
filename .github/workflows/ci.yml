name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Resolve package
        run: swift package resolve

      - name: Build release binary
        id: build
        continue-on-error: true
        run: swift build -c release > build.log 2>&1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build.log
          if-no-files-found: error
          retention-days: 3

      - name: Run tests
        if: steps.build.outcome == 'success'
        run: swift test --parallel

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 160 build.log
          exit 1
